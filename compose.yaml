services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # Allow the application migration user to create the sync triggers while
    # MySQL binary logging is enabled.
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bangumi_recorder}
      MYSQL_USER: ${MYSQL_USER:-bangumi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    image: bangumi-recorder:local
    entrypoint: ["bangumi-recorder-migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-bangumi}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-bangumi_recorder}

  app:
    build:
      context: .
    image: bangumi-recorder:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      LISTEN: 0.0.0.0
      LISTEN_PORT: 8080
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: mysql://${MYSQL_USER:-bangumi}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-bangumi_recorder}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALLOW_REGISTER: ${ALLOW_REGISTER:-true}
      REGISTER_NEED_TOKEN: ${REGISTER_NEED_TOKEN:-false}
      REGISTER_TOKEN: ${REGISTER_TOKEN:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      IMDB_SEARCH_MODE: ${IMDB_SEARCH_MODE:-no_api}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/v2/version >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mysql-data:
